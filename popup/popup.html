<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube helper</title>
    <link href="./popup.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">📝 YouTube Заметки</h1>
        </div>

        <div class="actions-bar">
            <button id="addBookmarkBtn" class="btn-action btn-add">
                <span>
                    <svg height="24" viewBox="0 0 24 24" width="24" fill="white" style="pointer-events: none; display: inherit; width: 80%; height: 80%;">
                        <path d="M12 3a1 1 0 00-1 1v7H4a1 1 0 000 2h7v7a1 1 0 002 0v-7h7a1 1 0 000-2h-7V4a1 1 0 00-1-1Z"></path>
                    </svg>
                </span>
                <span>Добавить заметку</span>
            </button>
            <button id="deleteBookmarksBtn" class="btn-action btn-clear">
                <span>🗑️</span>
                <span>Очистить все</span>
            </button>
        </div>

        <div class="notes-list" id="notesContainer">
            <!-- Заметки будут вставлены здесь динамически -->
        </div>
    </div>

    <!-- Модальное окно для добавления/редактирования заметки -->
    <div id="bookmarkModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Добавить заметку</h2>
            <form id="bookmarkForm">
                <div class="form-group">
                    <label for="bookmarkName">Название:</label>
                    <input type="text" id="bookmarkName" required maxlength="50" placeholder="Введите название заметки">
                </div>
                <div class="form-group">
                    <label for="bookmarkTime">Время (HH:MM:SS.SSS):</label>
                    <input type="time" step="0.001" id="bookmarkTime" required min="0" placeholder="0">
                </div>
                <div class="form-group">
                    <label for="bookmarkDescription">Описание:</label>
                    <textarea id="bookmarkDescription" maxlength="500" placeholder="Введите описание заметки"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" id="cancelBtn" class="modal-btn cancel-btn">Отмена</button>
                    <button type="submit" id="saveBtn" class="modal-btn save-btn">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="./popup.js"></script>
</body>
</html>
